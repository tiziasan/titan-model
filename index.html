<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Does a Wait Mean the Same Thing for Every Model?</title>
<style>
  :root{
    --ink:#1b1d24; --ink-soft:#4a4f5e; --ink-faint:#8a90a0;
    --line:#e6e7ee; --line-soft:#f0f1f5;
    --bg:#fbfbfd; --surface:#ffffff;
    --accent:#4f46e5; --accent-soft:#eef0fe; --accent-ink:#3730a3;
    --user-bubble:#4f46e5; --assistant-bubble:#f5f6fa;
    --ok:#15803d; --err:#b91c1c;
    --radius:14px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,22,34,.04), 0 8px 30px rgba(20,22,34,.06);
    --maxw:760px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:28px 20px 96px;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(251,251,253,.85);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:var(--maxw);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
  .brand{font-weight:650;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
  .progress{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--accent);width:0;transition:width .4s ease}
  .step-label{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap}

  h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0 0 10px}
  h2{font-size:19px;letter-spacing:-.01em;margin:0 0 6px}
  h3.section{font-size:13px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);margin:26px 0 14px;padding-top:18px;border-top:1px solid var(--line)}
  h3.section:first-child{border-top:none;padding-top:0;margin-top:0}
  p.lede{color:var(--ink-soft);font-size:15.5px;margin:0 0 20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;margin:0 0 18px}
  .eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
  label.field{display:block;margin:0 0 18px}
  label.field > .q{display:block;font-weight:550;font-size:15px;margin:0 0 8px;color:var(--ink)}
  .hint{font-weight:400;color:var(--ink-faint);font-size:13px}
  input[type=text],input[type=number],select,textarea{
    width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:#fff;outline:none;transition:border-color .15s, box-shadow .15s;
  }
  textarea{min-height:84px;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .likert{margin:0 0 22px}
  .likert .q{font-weight:550;font-size:15px;margin:0 0 10px}
  .scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .scale .opt{position:relative}
  .scale .opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
  .scale .opt label{display:flex;align-items:center;justify-content:center;height:42px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--ink-soft);transition:all .12s;background:#fff;user-select:none}
  .scale .opt input:checked + label{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .scale .opt input:focus-visible + label{box-shadow:0 0 0 3px var(--accent-soft)}
  .scale-ends{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--ink-faint)}

  .radios{display:flex;flex-direction:column;gap:8px}
  .radios .row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;transition:all .12s;font-size:15px}
  .radios .row:hover{border-color:#cdd0e0}
  .radios input{accent-color:var(--accent);width:18px;height:18px}

  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;padding:13px 22px;border-radius:11px;background:var(--accent);color:#fff;transition:transform .08s, background .15s, box-shadow .15s;box-shadow:0 1px 2px rgba(79,70,229,.25)}
  .btn:hover{background:#4338ca}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{background:#c7c9d6;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{border-color:#cdd0e0;background:#fafafe}
  .btn.wide{width:100%}
  .actions{display:flex;gap:12px;justify-content:flex-end;margin-top:8px}
  .err{color:var(--err);font-size:13.5px;margin-top:10px;min-height:18px}

  .chat-shell{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;height:min(72vh,620px)}
  .chat-head{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
  .avatar{width:32px;height:32px;border-radius:9px;flex:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
  .chat-title{font-weight:600;font-size:14.5px}
  .chat-sub{font-size:12px;color:var(--ink-faint)}
  .chat-body{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
  .msg{display:flex;gap:11px;max-width:100%}
  .msg .bubble{padding:12px 15px;border-radius:14px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{justify-content:flex-end}
  .msg.user .bubble{background:var(--user-bubble);color:#fff;border-bottom-right-radius:5px;max-width:78%}
  .msg.assistant .bubble{background:var(--assistant-bubble);color:var(--ink);border-bottom-left-radius:5px;max-width:88%}
  .msg.assistant .av{width:28px;height:28px;border-radius:8px;flex:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}

  .chat-input{border-top:1px solid var(--line-soft);padding:13px 16px;display:flex;flex-direction:column;gap:10px}
  .composer{display:flex;gap:10px;align-items:flex-end}
  .composer textarea{min-height:46px;max-height:120px}
  .send{flex:none;width:46px;height:46px;border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .send:disabled{background:#c7c9d6;cursor:not-allowed}

  /* fancy "thinking" loader (animated wait) */
  .thinking{display:flex;gap:11px;align-items:center}
  .orb-wrap{position:relative;width:30px;height:30px;flex:none}
  .orb{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a5b4fc,#6366f1 55%,#4f46e5);box-shadow:0 0 16px rgba(99,102,241,.55);animation:orbPulse 1.6s ease-in-out infinite}
  .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;border-top-color:rgba(99,102,241,.7);border-right-color:rgba(139,92,246,.4);animation:spin 1.1s linear infinite}
  .particle{position:absolute;top:50%;left:50%;width:3px;height:3px;border-radius:50%;background:#8b5cf6;margin:-1.5px;animation:orbit 2.4s linear infinite;opacity:.85}
  .particle:nth-child(4){animation-delay:-.8s;background:#6366f1}
  .particle:nth-child(5){animation-delay:-1.6s;background:#a5b4fc}
  @keyframes orbPulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes orbit{from{transform:rotate(0deg) translateX(15px) rotate(0deg)}to{transform:rotate(360deg) translateX(15px) rotate(-360deg)}}
  .think-text{font-size:14.5px;color:var(--ink-soft)}
  .shimmer{background:linear-gradient(90deg,var(--ink-faint) 25%,var(--ink) 50%,var(--ink-faint) 75%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2s linear infinite;font-weight:600}
  @keyframes shimmer{to{background-position:-200% 0}}
  .think-elapsed{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-top:4px}

  /* plain typing dots (instant + silent waits — no effort cue) */
  .dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--ink-faint);animation:blink 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .modelcard{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:18px;margin:0 0 20px}
  .modelcard-head{display:flex;align-items:center;gap:13px;margin-bottom:12px}
  .modelcard-name{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .modelcard-sub{font-size:12.5px;color:var(--accent-ink);font-weight:600;margin-top:2px}
  .modelcard-desc{margin:0;font-size:14.5px;color:var(--ink-soft);line-height:1.55}
  .pill{display:inline-block;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
  .divider{height:1px;background:var(--line);margin:22px 0}
  .center{text-align:center}
  .muted{color:var(--ink-faint);font-size:13.5px}
  .success-tick{width:54px;height:54px;border-radius:50%;background:#dcfce7;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px}
  .cellbadge{display:inline-block;font-family:var(--mono);font-size:11.5px;background:#0f1117;color:#c7cbe0;border-radius:6px;padding:3px 8px}
  pre.preview{background:#0f1117;color:#d7dbe6;border-radius:10px;padding:14px;font-family:var(--mono);font-size:11.5px;overflow:auto;max-height:220px;white-space:pre}
  code{font-family:var(--mono);background:var(--line-soft);padding:1px 5px;border-radius:5px;font-size:.9em}
  @media (max-width:560px){
    .scale{gap:3px}
    .scale .opt label{height:38px;font-size:13px}
    h1{font-size:22px}
    .card{padding:20px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important}
    .orb{animation:none}.ring{animation:none}.particle{display:none}.shimmer{animation:none;color:var(--ink)}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <span class="brand" id="brand">Perceived Quality Study</span>
    <div class="progress"><span id="progbar"></span></div>
    <span class="step-label" id="steplabel"></span>
  </div>
</div>
<div class="wrap" id="root"></div>

<script>
/* ================================================================
   ███  BETWEEN-SUBJECTS ENGINE (single study) ███████████████████
   Implements the project brief
   ("Does a Wait Mean the Same Thing for Every Model?"):

     2 (label: small / large) × 3 (wait: instant / 9s silent /
     9s animated), FULLY BETWEEN-SUBJECTS.

   Each participant is randomly assigned to exactly ONE of the six
   cells and keeps it for the whole session. They see ONE
   interaction; the response text is IDENTICAL in every cell (same
   frozen words, every time) — so the only things that differ are
   the disclosed model label and the wait. Then they answer the
   full measure battery. One CSV row per participant.

   Study content lives in an external file, loaded automatically:
     Experiment1-questions.js  (keep it in the same folder)

   Optional cell forcing (for balancing / piloting), e.g.:
     index.html?cell=large__animated
   Valid ids are  <labelId>__<waitId>  (see the config file).
   ================================================================ */

const QUESTIONS_FILE = 'Experiment1-questions.js';

const root = document.getElementById('root');
const progbar = document.getElementById('progbar');
const steplabel = document.getElementById('steplabel');
const brandEl = document.getElementById('brand');

const STEPS = ['Intro','About you','Instructions','Interaction','Your impressions','Final','Complete'];
const TOTAL_STEPS = STEPS.length;
function setProgress(i){
  progbar.style.width = Math.round((i/(TOTAL_STEPS-1))*100) + '%';
  steplabel.textContent = STEPS[i] || '';
}

let EXP = null;
const state = {
  pid: makeId(),
  sessionStartIso: new Date().toISOString(),
  assignment: null,        // { labelId, waitId, cellId, method }
  demographics: {},
  interaction: {},
  measures: {},
  final: {},
};

function makeId(){ return 'P-' + Date.now().toString(36).slice(-5) + '-' + Math.random().toString(36).slice(2,6); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= NO-BACKEND TIME-SLOT BALANCING =================
   There's no shared server here (static HTML on GitHub Pages), so we
   can't keep a real cross-participant counter. Instead we carve wall-
   clock time into fixed-size windows and walk deterministically
   through a shuffled permutation of the six cells, one cell per
   window, reshuffling every full cycle of six. Every browser computes
   the same window -> same cell from Date.now() alone, so as long as
   participants don't land in the *same* window simultaneously, this
   behaves like round-robin/block randomization spread out over time.
   Tune `balancing.windowMs` in the config to roughly your expected
   time between participants (see README). This is an approximation,
   not exact balance under a simultaneous mass recruitment blast. */
function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rand = mulberry32(seed);
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function scheduledCell(cells, balancing){
  const n = cells.length;
  const windowMs = (balancing && balancing.windowMs) || 3 * 60 * 1000;
  const epochMs = (balancing && balancing.epochMs) || 0;
  const slot = Math.floor((Date.now() - epochMs) / windowMs);
  const cycle = Math.floor(slot / n);
  const posInCycle = ((slot % n) + n) % n;
  const order = seededShuffle([...Array(n).keys()], cycle);
  return cells[order[posInCycle]];
}

/* ================= LOAD QUESTIONS FILE ================= */
function loadQuestions(){
  return new Promise((resolve, reject)=>{
    delete window.EXPERIMENT_CONFIG;
    const s = document.createElement('script');
    s.src = QUESTIONS_FILE;
    s.onload = ()=> window.EXPERIMENT_CONFIG ? resolve(window.EXPERIMENT_CONFIG)
      : reject(new Error(`${QUESTIONS_FILE} loaded but never set window.EXPERIMENT_CONFIG.`));
    s.onerror = ()=> reject(new Error(`Couldn't find ${QUESTIONS_FILE}. Keep it in the same folder as this HTML file.`));
    document.body.appendChild(s);
  });
}

async function init(){
  root.innerHTML = `<div class="card center"><p class="muted">Loading…</p></div>`;
  EXP = await loadQuestions();
  brandEl.textContent = (EXP.meta && EXP.meta.title) || 'Perceived Quality Study';

  EXP._cells = [];
  Object.values(EXP.labels).forEach(lab=>{
    Object.values(EXP.waits).forEach(w=>{
      EXP._cells.push({ cellId: lab.id + '__' + w.id, labelId: lab.id, waitId: w.id });
    });
  });

  const forced = new URLSearchParams(location.search).get('cell');
  let cell = null, method = 'time_balanced';
  if(forced){ cell = EXP._cells.find(c=>c.cellId === forced); if(cell) method = 'url_forced'; }
  if(!cell){
    if(EXP.balancing && EXP.balancing.mode === 'random'){ cell = pick(EXP._cells); method = 'random'; }
    else { cell = scheduledCell(EXP._cells, EXP.balancing); method = 'time_balanced'; }
  }
  state.assignment = { ...cell, method };
}

function screenLoadError(err){
  root.innerHTML = `
    <div class="card">
      <p class="eyebrow">Setup problem</p>
      <h2>Couldn't start the study</h2>
      <p class="lede">${esc(err.message||String(err))}</p>
      <p class="muted">Make sure <code>${esc(QUESTIONS_FILE)}</code> is in the same folder as this HTML file, and that you opened this page over http(s) or by double-clicking it locally.</p>
    </div>`;
}

/* ================= FIELD RENDERING ================= */
function isRequired(f){ return (typeof f.required === 'boolean') ? f.required : (f.type !== 'textarea'); }
function fieldText(f){ return `<label class="field"><span class="q">${esc(f.label)}${isRequired(f)?'':' <span class="hint">(optional)</span>'}</span><input type="text" name="${esc(f.name)}" placeholder="${esc(f.placeholder||'')}"></label>`; }
function fieldArea(f){ return `<label class="field"><span class="q">${esc(f.label)}${isRequired(f)?'':' <span class="hint">(optional)</span>'}</span><textarea name="${esc(f.name)}" placeholder="${esc(f.placeholder||'')}"></textarea></label>`; }
function fieldNumber(f){ return `<label class="field"><span class="q">${esc(f.label)}${isRequired(f)?'':' <span class="hint">(optional)</span>'}</span><input type="number" name="${esc(f.name)}" placeholder="${esc(f.placeholder||'')}" ${f.min!==undefined?`min="${esc(f.min)}"`:''} ${f.max!==undefined?`max="${esc(f.max)}"`:''} ${f.step!==undefined?`step="${esc(f.step)}"`:''}></label>`; }
function fieldSelect(f){ return `<label class="field"><span class="q">${esc(f.label)}</span><select name="${esc(f.name)}"><option value="" disabled selected>Select…</option>${(f.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></label>`; }
function fieldRadio(f){ return `<label class="field"><span class="q">${esc(f.label)}</span><div class="radios">${(f.options||[]).map(o=>`<label class="row"><input type="radio" name="${esc(f.name)}" value="${esc(o)}">${esc(o)}</label>`).join('')}</div></label>`; }
function fieldLikert(f){
  return `<div class="likert"><div class="q">${esc(f.label)}</div>
    <div class="scale">${[1,2,3,4,5,6,7].map(n=>`<div class="opt"><input type="radio" id="${esc(f.name)}_${n}" name="${esc(f.name)}" value="${n}"><label for="${esc(f.name)}_${n}">${n}</label></div>`).join('')}</div>
    <div class="scale-ends"><span>${esc(f.lo||'Low')}</span><span>${esc(f.hi||'High')}</span></div></div>`;
}
function fieldSection(f){ return `<h3 class="section">${esc(f.label)}</h3>`; }
function renderField(f){
  switch(f.type){
    case 'section':  return fieldSection(f);
    case 'number':   return fieldNumber(f);
    case 'text':     return fieldText(f);
    case 'textarea': return fieldArea(f);
    case 'select':   return fieldSelect(f);
    case 'radio':    return fieldRadio(f);
    case 'likert':   return fieldLikert(f);
    default:         return '';
  }
}
function collectForm(id){
  const c = document.getElementById(id); const data = {};
  c.querySelectorAll('input[type=text],input[type=number],textarea,select').forEach(el=>{ if(el.name && el.value!=='') data[el.name] = el.value.trim ? el.value.trim() : el.value; });
  c.querySelectorAll('input[type=radio]:checked').forEach(el=>{ data[el.name] = el.value; });
  return data;
}
function validate(fields, data){
  return (fields||[]).filter(f=>f.type!=='section' && isRequired(f)).map(f=>f.name).filter(k=>!data[k]);
}

/* ================= SCREENS ================= */
function screenWelcome(){
  setProgress(0);
  const title = (EXP.meta && EXP.meta.welcomeTitle) || 'How do people judge AI responses?';
  const desc = (EXP.meta && EXP.meta.description) || "You'll chat with an AI assistant once and rate its response.";
  root.innerHTML = `
    <div class="card">
      <p class="eyebrow">Research study</p>
      <h1>${esc(title)}</h1>
      <p class="lede">${esc(desc)}</p>
      <ul class="muted" style="line-height:1.9;padding-left:18px;margin:0 0 22px">
        <li>Your responses are anonymous and used only for research.</li>
        <li>The whole thing takes about 4–6 minutes.</li>
        <li>Please don't refresh the page, your progress isn't saved between sessions.</li>
      </ul>
      <div class="actions"><button class="btn" id="go">Begin</button></div>
    </div>
    <p class="muted center">Participant ID: <code>${state.pid}</code> · cell: <span class="cellbadge">${esc(state.assignment.cellId)}</span></p>`;
  document.getElementById('go').onclick = screenDemographics;
}

function screenDemographics(){
  setProgress(1);
  const fields = EXP.demographics || [];
  root.innerHTML = `
    <div class="card">
      <p class="eyebrow">Step 1 · About you</p>
      <h2>A few quick questions</h2>
      <p class="lede">These help us understand who took part.</p>
      <div id="form">${fields.map(renderField).join('')}</div>
      <div class="err" id="err"></div>
      <div class="actions"><button class="btn" id="next">Continue</button></div>
    </div>`;
  document.getElementById('next').onclick = ()=>{
    const data = collectForm('form');
    const missing = validate(fields, data);
    if(missing.length){ document.getElementById('err').textContent='Please answer all required questions before continuing.'; return; }
    state.demographics = data;
    screenInstructions();
  };
}

function screenInstructions(){
  setProgress(2);
  const label = EXP.labels[state.assignment.labelId];
  const avatarTxt = label.chatName.slice(0,1).toUpperCase();
  root.innerHTML = `
    <div class="card">
      <p class="eyebrow">Step 2 · How it works</p>
      <h2>What you'll do</h2>
      <p class="lede">You'll send one message to an AI assistant, read its reply, and then answer a few questions about it.</p>
      <p class="lede" style="margin-bottom:12px">For this session you've been connected to:</p>
      <div class="modelcard">
        <div class="modelcard-head">
          <div class="avatar" style="width:40px;height:40px;font-size:16px">${esc(avatarTxt)}</div>
          <div>
            <div class="modelcard-name">${esc(label.chatName)}</div>
            ${label.chatSub?`<div class="modelcard-sub">${esc(label.chatSub)}</div>`:''}
          </div>
        </div>
        ${label.description?`<p class="modelcard-desc">${esc(label.description)}</p>`:''}
      </div>
      <p class="muted">Just go with your gut, your first impression is what we're after.</p>
      <div class="actions"><button class="btn" id="start">Start</button></div>
    </div>`;
  document.getElementById('start').onclick = screenChat;
}

/* ---------- THE SINGLE INTERACTION ---------- */
function screenChat(){
  setProgress(3);
  const cell = state.assignment;
  const label = EXP.labels[cell.labelId];
  const wait = EXP.waits[cell.waitId];
  const avatarTxt = label.chatName.slice(0,1).toUpperCase();
  const promptText = EXP.prompt.text;

  root.innerHTML = `
    <p class="pill">You're chatting with ${esc(label.chatName)}</p>
    <div style="height:12px"></div>
    <div class="chat-shell">
      <div class="chat-head">
        <div class="avatar">${esc(avatarTxt)}</div>
        <div><div class="chat-title">${esc(label.chatName)}</div><div class="chat-sub">${esc(label.chatSub||'Online · ready to help')}</div></div>
      </div>
      <div class="chat-body" id="body">
        <div class="msg assistant"><div class="av">${esc(avatarTxt)}</div><div class="bubble">Hi! Send me your message and I'll respond.</div></div>
      </div>
      <div class="chat-input">
        <div class="composer">
          <textarea id="composer" rows="1" readonly aria-readonly="true" title="This message is fixed for the study and can't be edited">${esc(promptText)}</textarea>
          <button class="send" id="send" title="Send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 8 6 8-16-8z" fill="currentColor"/></svg></button>
        </div>
      </div>
    </div>
    <p class="muted center" style="margin-top:14px">Read the response, then continue to the questions.</p>`;

  const body = document.getElementById('body');
  const composer = document.getElementById('composer');
  const sendBtn = document.getElementById('send');
  let sent = false;

  composer.style.height='auto'; composer.style.height=Math.min(120,composer.scrollHeight)+'px';
  composer.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); } });
  sendBtn.onclick = doSend;

  function doSend(){
    if(sent) return;
    const text = promptText;
    sent = true;
    composer.disabled = true; sendBtn.disabled = true;

    const u = document.createElement('div'); u.className='msg user';
    u.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    body.appendChild(u); body.scrollTop = body.scrollHeight;

    const loadEl = document.createElement('div'); loadEl.className='msg assistant';
    loadEl.innerHTML = (wait.style==='animated') ? fancyLoaderHTML(avatarTxt) : dotsLoaderHTML(avatarTxt);
    body.appendChild(loadEl); body.scrollTop = body.scrollHeight;

    const tStart = performance.now();
    const cleanup = (wait.style==='animated') ? animateFancy(loadEl, wait.durationMs) : ()=>{};

    setTimeout(()=>{
      cleanup();
      const actualWaitMs = Math.round(performance.now() - tStart);
      const respText = EXP.prompt.response;
      loadEl.innerHTML = `<div class="av">${esc(avatarTxt)}</div><div class="bubble">${esc(respText)}</div>`;
      body.scrollTop = body.scrollHeight;
      const revealPerf = performance.now();

      const cont = document.createElement('div'); cont.style.cssText='margin-top:6px';
      cont.innerHTML = `<button class="btn wide" id="toSurvey">Continue to questions</button>`;
      body.appendChild(cont); body.scrollTop = body.scrollHeight;
      document.getElementById('toSurvey').onclick = ()=>{
        state.interaction = {
          userText: text, responseChars: respText.length,
          targetWaitMs: wait.durationMs, actualWaitMs,
          viewMs: Math.round(performance.now()-revealPerf),
        };
        screenSurvey();
      };
    }, wait.durationMs);
  }
}

function dotsLoaderHTML(av){ return `<div class="av">${esc(av)}</div><div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div>`; }
function fancyLoaderHTML(av){
  return `<div class="av">${esc(av)}</div><div class="bubble"><div class="thinking">
    <div class="orb-wrap"><div class="ring"></div><div class="orb"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>
    <div><div class="think-text"><span class="shimmer" id="thinkPhase">Thinking…</span></div><div class="think-elapsed" id="thinkElapsed">0.0s</div></div>
  </div></div>`;
}
function animateFancy(el, totalMs){
  const phases = ["Reading your message…","Considering the task…","Reasoning it through…","Weighing the details…","Composing a response…","Refining the wording…","Almost there…"];
  const p = el.querySelector('#thinkPhase'), e = el.querySelector('#thinkElapsed'), t0 = performance.now();
  let i=0; if(p) p.textContent = phases[0];
  const ph = setInterval(()=>{ i=(i+1)%phases.length; if(p) p.textContent=phases[i]; }, Math.max(900, Math.floor(totalMs/phases.length)));
  const tk = setInterval(()=>{ if(e) e.textContent = ((performance.now()-t0)/1000).toFixed(1)+'s'; }, 100);
  return ()=>{ clearInterval(ph); clearInterval(tk); };
}

/* ---------- SURVEY (measures + manipulation checks) ---------- */
function screenSurvey(){
  setProgress(4);
  const fields = EXP.measures || [];
  root.innerHTML = `
    <div class="card">
      <p class="eyebrow">Step 3 · Your impressions</p>
      <h2>About the response you just read</h2>
      <p class="lede">Please answer based on your honest first impression.</p>
      <div id="survey">${fields.map(renderField).join('')}</div>
      <div class="err" id="err"></div>
      <div class="actions"><button class="btn" id="next">Continue</button></div>
    </div>`;
  document.getElementById('next').onclick = ()=>{
    const data = collectForm('survey');
    const missing = validate(fields, data);
    if(missing.length){ document.getElementById('err').textContent='Please answer all required questions before continuing.'; return; }
    state.measures = data;
    screenFinal();
  };
}

/* ---------- FINAL ---------- */
function screenFinal(){
  setProgress(5);
  const fields = EXP.finalBlock || [];
  root.innerHTML = `
    <div class="card">
      <p class="eyebrow">Almost done</p>
      <h2>A few wrap-up questions</h2>
      <div id="final">${fields.map(renderField).join('')}</div>
      <div class="err" id="err"></div>
      <div class="actions"><button class="btn" id="done">Submit &amp; finish</button></div>
    </div>`;
  document.getElementById('done').onclick = ()=>{
    const data = collectForm('final');
    const missing = validate(fields, data);
    if(missing.length){ document.getElementById('err').textContent='Please answer the required questions before submitting.'; return; }
    state.final = data;
    screenDone();
  };
}

/* ---------- DONE + EXPORT ---------- */
function screenDone(){
  setProgress(6);
  root.innerHTML = `
    <div class="card center">
      <div class="success-tick" id="tick">…</div>
      <h2 id="title">Submitting your response…</h2>
      <p class="lede" id="lede">One moment, sending your data.</p>
      <p class="muted">Participant ID: <code>${state.pid}</code> · cell: <span class="cellbadge">${esc(state.assignment.cellId)}</span></p>
    </div>`;
  submitResult().then(ok=>{
    document.getElementById('tick').textContent = ok ? '✓' : '!';
    document.getElementById('title').textContent = ok ? "Thank you, you're all done" : 'Submission problem';
    document.getElementById('lede').textContent = ok
      ? 'Your response has been recorded. You can close this tab.'
      : "We couldn't reach the results server (are you offline?). Please tell the researcher your participant ID above so your response isn't lost.";
  });
}

/* ================= DATA / SUBMIT ================= */
function buildRowData(){
  const demoKeys = (EXP.demographics||[]).filter(f=>f.type!=='section').map(f=>f.name);
  const measKeys = (EXP.measures||[]).filter(f=>f.type!=='section').map(f=>f.name);
  const finalKeys = (EXP.finalBlock||[]).filter(f=>f.type!=='section').map(f=>f.name);
  const I = state.interaction;

  const header = [
    'participant_id','session_start','experiment_id',
    'cell_id','label_condition','wait_condition','assignment_method',
    'target_wait_ms','actual_wait_ms','view_ms','response_chars',
    ...demoKeys.map(k=>'demo_'+k),
    ...measKeys.map(k=>'m_'+k),
    ...finalKeys.map(k=>'final_'+k),
    'user_text'
  ];
  const row = [
    state.pid, state.sessionStartIso, (EXP.meta&&EXP.meta.id)||'',
    state.assignment.cellId, state.assignment.labelId, state.assignment.waitId, state.assignment.method,
    I.targetWaitMs, I.actualWaitMs, I.viewMs, I.responseChars,
    ...demoKeys.map(k=> state.demographics[k]!==undefined?state.demographics[k]:''),
    ...measKeys.map(k=> state.measures[k]!==undefined?state.measures[k]:''),
    ...finalKeys.map(k=> state.final[k]!==undefined?state.final[k]:''),
    I.userText
  ];
  return { header, row };
}
// One flat { column_name: value } object -- easiest shape for the Apps Script
// receiver to turn into a Sheet row (see apps-script/Code.gs).
function buildResultPayload(){
  const { header, row } = buildRowData();
  const obj = {};
  header.forEach((k,i)=> obj[k] = row[i]);
  return obj;
}
// POSTs the result to the Google Sheet web app configured in
// EXP.submission.webAppUrl. Apps Script web apps don't reliably support
// reading a cross-origin response back (CORS on the redirect), so this
// fires with mode:'no-cors' -- a resolved fetch means the request went out,
// not that the row was definitely written. Check the Sheet against your
// expected participant count if you want a stronger guarantee.
async function submitResult(){
  const url = EXP.submission && EXP.submission.webAppUrl;
  if(!url){ console.error('EXP.submission.webAppUrl is not configured -- nothing was sent.'); return false; }
  try{
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(buildResultPayload()),
    });
    return true;
  }catch(err){
    console.error('Result submission failed:', err);
    return false;
  }
}
/* ================= BOOT ================= */
(async function boot(){
  try{ await init(); screenWelcome(); }
  catch(e){ screenLoadError(e); }
})();
</script>
